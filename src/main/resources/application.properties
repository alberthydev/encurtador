spring.application.name=url-shortener

# Banco (H2). No docker-compose a URL é sobrescrita para arquivo em volume.
spring.datasource.url=jdbc:h2:mem:shortener;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.shutdown=graceful

# Actuator / Micrometer / Prometheus
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=url-shortener
management.metrics.distribution.percentiles-histogram.http.server.requests=true

app.base-url=${APP_BASE_URL:http://localhost:8080}

# DEBUG para o código da aplicação (visível no Graylog)
logging.level.com.example.urlshortener=DEBUG
